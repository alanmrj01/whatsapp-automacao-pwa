[build]
  command = "npm run build"
  publish = "dist"

# Keep auth/session same-origin from the browser's perspective. The PWA calls
# /api/* on its own origin and Netlify proxies to Cloud Run server-side.
# Login gets a stricter per-IP edge limit before the generic auth/API proxies.
[[redirects]]
  from = "/api/v1/auth/login"
  to = "https://whatsapp-backend-186627697999.southamerica-east1.run.app/api/v1/auth/login"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 8
    window_size = 60
    aggregate_by = ["ip", "domain"]

# Protect refresh/logout/active-business from request floods without interfering
# with normal multi-tab session restoration.
[[redirects]]
  from = "/api/v1/auth/*"
  to = "https://whatsapp-backend-186627697999.southamerica-east1.run.app/api/v1/auth/:splat"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 60
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/*"
  to = "https://whatsapp-backend-186627697999.southamerica-east1.run.app/api/:splat"
  status = 200
  force = true

# SPA deep-link fallback. Keep this after the API proxy so /api is never served
# by the React shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Permitted-Cross-Domain-Policies = "none"
    Referrer-Policy = "strict-origin-when-cross-origin"
