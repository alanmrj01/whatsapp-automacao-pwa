[build]
  command = "test -n \"$ALOVIA_API_ORIGIN\" && sed -i \"s|ALOVIA_API_ORIGIN_PLACEHOLDER|${ALOVIA_API_ORIGIN%/}|g\" netlify.toml && npm run build"
  publish = "dist"

# Environment-aware same-origin API proxy. ALOVIA_API_ORIGIN is injected by Netlify at build time.\n# Production and productivity must use different backend origins.\n# Keep browser traffic on the ALOVIA origin
# while Netlify forwards authenticated API requests to the stable Cloud Run URL.

# Keep auth/session same-origin from the browser's perspective. The PWA calls
# /api/* on its own origin and Netlify proxies to Cloud Run server-side.
# Login gets a stricter per-IP edge limit before the generic auth/API proxies.
[[redirects]]
  from = "/api/v1/auth/login"
  to = "ALOVIA_API_ORIGIN_PLACEHOLDER/api/v1/auth/login"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 8
    window_size = 60
    aggregate_by = ["ip", "domain"]

# Protect refresh/logout/active-business from request floods without interfering
# with normal multi-tab session restoration.
[[redirects]]
  from = "/api/v1/auth/*"
  to = "ALOVIA_API_ORIGIN_PLACEHOLDER/api/v1/auth/:splat"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 60
    window_size = 60
    aggregate_by = ["ip", "domain"]

# Keep the exact checkout-creation route before the wildcard. Netlify uses
# first-match routing; placing the wildcard first rewrites the empty splat as a
# trailing slash and makes FastAPI answer 307 before the POST reaches the route.
[[redirects]]
  from = "/api/v1/billing/checkouts"
  to = "ALOVIA_API_ORIGIN_PLACEHOLDER/api/v1/billing/checkouts"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 30
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/v1/billing/checkouts/*"
  to = "ALOVIA_API_ORIGIN_PLACEHOLDER/api/v1/billing/checkouts/:splat"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 30
    window_size = 60
    aggregate_by = ["ip", "domain"]

# Diagnostic endpoints live outside the backend /api namespace. Keep these
# exact same-origin aliases before the generic /api/* proxy for smoke/readiness checks.
[[redirects]]
  from = "/api/health"
  to = "ALOVIA_API_ORIGIN_PLACEHOLDER/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/health/db"
  to = "ALOVIA_API_ORIGIN_PLACEHOLDER/health/db"
  status = 200
  force = true

[[redirects]]
  from = "/api/ready"
  to = "ALOVIA_API_ORIGIN_PLACEHOLDER/ready"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "ALOVIA_API_ORIGIN_PLACEHOLDER/api/:splat"
  status = 200
  force = true

# SPA deep-link fallback. Keep this after the API proxy so /api is never served
# by the React shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/app/checkout*"
  [headers.values]
    Cache-Control = "no-store"
    Pragma = "no-cache"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' https://connect.facebook.net; script-src-elem 'self' https://connect.facebook.net; script-src-attr 'none'; connect-src 'self' https://www.facebook.com https://web.facebook.com https://graph.facebook.com https://connect.facebook.net; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' https://connect.facebook.net https://player.vimeo.com; script-src-elem 'self' https://connect.facebook.net https://player.vimeo.com 'unsafe-inline'; script-src-attr 'none'; connect-src 'self' https://www.facebook.com https://web.facebook.com https://graph.facebook.com https://connect.facebook.net; frame-src https://www.facebook.com https://web.facebook.com https://staticxx.facebook.com https://player.vimeo.com; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Permitted-Cross-Domain-Policies = "none"
    Referrer-Policy = "strict-origin-when-cross-origin"